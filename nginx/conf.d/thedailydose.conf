server {
    listen 80;
    server_name thedailydose.live www.thedailydose.live;
    client_max_body_size 7000000M;
	return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name thedailydose.live www.thedailydose.live;

    client_max_body_size 7000000M;

    ssl_certificate     /etc/letsencrypt/live/thedailydose.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thedailydose.live/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}

